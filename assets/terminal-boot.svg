<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
  <title id="title">Animated terminal boot screen</title>
  <desc id="desc">A dark neon-blue terminal that sequentially reveals machine-learning development status lines.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip"><rect x="18" y="18" width="964" height="194" rx="12"/></clipPath>
  </defs>
  <style>
    .mono{font-family:Consolas,'Courier New',monospace}
    .line{opacity:1;animation:reveal .45s ease-out}
    .l1{animation-delay:.25s}.l2{animation-delay:.75s}.l3{animation-delay:1.25s}.l4{animation-delay:1.75s}.l5{animation-delay:2.25s}
    .cursor{animation:blink .9s steps(2,start) infinite}
    .scan{animation:scan 5s linear infinite;opacity:.12}
    .progress{animation:load 5s ease-in-out infinite;transform-origin:left center}
    @keyframes reveal{from{opacity:.45}to{opacity:1}}
    @keyframes blink{to{opacity:0}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(190px)}}
    @keyframes load{0%{transform:scaleX(.08)}65%{transform:scaleX(.88)}100%{transform:scaleX(1)}}
  </style>
  <rect x="10" y="10" width="980" height="210" rx="16" fill="#0D1117" stroke="url(#frame)" stroke-width="2.5"/>
  <rect x="18" y="18" width="964" height="34" rx="10" fill="#161B22"/>
  <circle cx="39" cy="35" r="5" fill="#FF5F57"/>
  <circle cx="57" cy="35" r="5" fill="#FEBC2E"/>
  <circle cx="75" cy="35" r="5" fill="#28C840"/>
  <text x="500" y="40" class="mono" font-size="12" fill="#8B949E" text-anchor="middle">ADE@ML-PORTFOLIO: ~/profile</text>
  <g clip-path="url(#screenClip)">
    <rect class="scan" x="18" y="53" width="964" height="2" fill="#58A6FF"/>
    <text x="38" y="79" class="mono" font-size="16" font-weight="700" fill="#58A6FF">$ ./initialize_profile.sh</text>
    <text x="38" y="108" class="mono line l1" font-size="14" fill="#C9D1D9">[BOOT] Initializing development environment...</text>
    <text x="38" y="132" class="mono line l2" font-size="14" fill="#C9D1D9">[LOAD] Machine learning modules.............. <tspan fill="#3FB950">[ OK ]</tspan></text>
    <text x="38" y="156" class="mono line l3" font-size="14" fill="#C9D1D9">[LOAD] Computer vision toolkit............... <tspan fill="#3FB950">[ OK ]</tspan></text>
    <text x="38" y="180" class="mono line l4" font-size="14" fill="#C9D1D9">[CHECK] Data pipeline and model artifacts.... <tspan fill="#3FB950">[ READY ]</tspan></text>
    <text x="38" y="204" class="mono line l5" font-size="14" fill="#58A6FF">System online. Ready to build intelligent solutions.</text>
    <rect x="765" y="86" width="185" height="7" rx="3.5" fill="#21262D" stroke="#30363D"/>
    <rect class="progress" x="765" y="86" width="185" height="7" rx="3.5" fill="url(#bar)" filter="url(#glow)"/>
    <text x="765" y="112" class="mono" font-size="10" fill="#8B949E">INITIALIZATION</text>
    <g transform="translate(765 140)" fill="none" stroke="#58A6FF" stroke-width="1.4" opacity=".85">
      <path d="M0 28 L22 11 L43 22 L66 0 L89 16 L112 7 L135 20 L158 4 L182 14"/>
      <path d="M0 33 H182" stroke="#30363D"/>
      <path d="M0 38 H182" stroke="#30363D"/>
      <path d="M0 43 H182" stroke="#30363D"/>
    </g>
    <text x="952" y="204" class="mono cursor" font-size="18" fill="#58A6FF">▌</text>
  </g>
</svg>
