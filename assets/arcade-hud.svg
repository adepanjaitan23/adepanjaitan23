<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Arcade player status HUD</title>
  <desc id="desc">A neon arcade dashboard with player status, pulsing pellets, and a Pac-Man-inspired character moving along a track.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono{font-family:Consolas,'Courier New',monospace}
    .pulse{animation:pulse 1.7s ease-in-out infinite}
    .d1{animation-delay:0s}.d2{animation-delay:.15s}.d3{animation-delay:.3s}.d4{animation-delay:.45s}.d5{animation-delay:.6s}.d6{animation-delay:.75s}.d7{animation-delay:.9s}.d8{animation-delay:1.05s}.d9{animation-delay:1.2s}.d10{animation-delay:1.35s}.d11{animation-delay:1.5s}.d12{animation-delay:1.65s}
    .runner{animation:run 6.5s ease-in-out infinite alternate}
    .status{animation:status 2s steps(2,start) infinite}
    @keyframes pulse{0%,100%{opacity:.28}50%{opacity:1}}
    @keyframes run{from{transform:translateX(0)}to{transform:translateX(380px)}}
    @keyframes status{50%{opacity:.35}}
  </style>
  <rect x="10" y="10" width="980" height="170" rx="12" fill="#0D1117" stroke="url(#edge)" stroke-width="2.5"/>
  <path d="M24 43 H976 M24 148 H976" stroke="#1F6FEB" stroke-opacity=".45"/>
  <path d="M24 52 H976 M24 61 H976 M24 70 H976 M24 79 H976 M24 88 H976 M24 97 H976 M24 106 H976 M24 115 H976 M24 124 H976 M24 133 H976" stroke="#58A6FF" stroke-opacity=".055"/>
  <text x="34" y="34" class="mono" font-size="13" font-weight="700" fill="#58A6FF" letter-spacing="2">PLAYER 01</text>
  <g transform="translate(34 49)">
    <path d="M0 0 C-8 -9 -19 -1 -14 8 L0 20 L14 8 C19 -1 8 -9 0 0Z" fill="#2563EB" filter="url(#neon)"/>
    <path d="M35 0 C27 -9 16 -1 21 8 L35 20 L49 8 C54 -1 43 -9 35 0Z" fill="#2563EB" opacity=".72"/>
    <path d="M70 0 C62 -9 51 -1 56 8 L70 20 L84 8 C89 -1 78 -9 70 0Z" fill="#2563EB" opacity=".45"/>
  </g>
  <text x="500" y="31" class="mono" font-size="18" font-weight="700" text-anchor="middle" fill="#E6EDF3" letter-spacing="3">ADE PANJAITAN</text>
  <text x="500" y="57" class="mono" font-size="11" text-anchor="middle" fill="#58A6FF" letter-spacing="2">AI &amp; MACHINE LEARNING</text>
  <circle cx="797" cy="28" r="5" fill="#3FB950" class="status"/>
  <text x="811" y="32" class="mono" font-size="12" fill="#3FB950" letter-spacing="1">SYSTEM ONLINE</text>
  <text x="952" y="57" class="mono" font-size="10" text-anchor="end" fill="#8B949E">LV. 01</text>
  <path d="M78 119 H650" stroke="#1F6FEB" stroke-opacity=".4" stroke-width="2"/>
  <g fill="#58A6FF" filter="url(#neon)">
    <circle class="pulse d1" cx="115" cy="119" r="3"/>
    <circle class="pulse d2" cx="155" cy="119" r="3"/>
    <circle class="pulse d3" cx="195" cy="119" r="3"/>
    <circle class="pulse d4" cx="235" cy="119" r="3"/>
    <circle class="pulse d5" cx="275" cy="119" r="3"/>
    <circle class="pulse d6" cx="315" cy="119" r="3"/>
    <circle class="pulse d7" cx="355" cy="119" r="3"/>
    <circle class="pulse d8" cx="395" cy="119" r="3"/>
    <circle class="pulse d9" cx="435" cy="119" r="3"/>
    <circle class="pulse d10" cx="475" cy="119" r="3"/>
    <circle class="pulse d11" cx="515" cy="119" r="3"/>
    <circle class="pulse d12" cx="555" cy="119" r="3"/>
  </g>
  <g transform="translate(0 119)" filter="url(#neon)">
    <g class="runner" transform="translate(70 0)">
      <path d="M0 -14 A14 14 0 1 0 0 14 L12 0 Z" fill="#FDE047" stroke="#F59E0B" stroke-width="1"/>
      <circle cx="-2" cy="-6" r="2" fill="#0D1117"/>
    </g>
  </g>
  <g transform="translate(693 94)">
    <path d="M0 20 V-1 Q0 -15 14 -15 Q28 -15 28 -1 V20 L22 14 L14 20 L7 14 Z" fill="#A855F7" opacity=".92" filter="url(#neon)"/>
    <circle cx="9" cy="-1" r="3" fill="#FFFFFF"/><circle cx="20" cy="-1" r="3" fill="#FFFFFF"/>
    <circle cx="10" cy="0" r="1.5" fill="#0D1117"/><circle cx="21" cy="0" r="1.5" fill="#0D1117"/>
  </g>
  <g transform="translate(758 75)">
    <rect x="0" y="0" width="202" height="62" rx="6" fill="#111827" stroke="#2563EB" stroke-width="1.5"/>
    <text x="14" y="19" class="mono" font-size="10" fill="#58A6FF">&gt; THINK</text>
    <text x="14" y="34" class="mono" font-size="10" fill="#58A6FF">&gt; BUILD</text>
    <text x="14" y="49" class="mono" font-size="10" fill="#58A6FF">&gt; IMPROVE</text>
    <path d="M172 12 L184 12 L184 50 L172 50" fill="none" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="34" y="164" class="mono" font-size="10" fill="#8B949E">MISSION: KEEP LEARNING</text>
  <text x="945" y="164" class="mono" font-size="9" text-anchor="end" fill="#8B949E">STATUS <tspan fill="#3FB950">READY</tspan></text>
</svg>
