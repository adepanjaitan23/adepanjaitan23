name: Skill Map Radar Charts

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate radar charts
        env:
          GITHUB_USERNAME: adepanjaitan23
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_radar_charts.py

      - name: Commit updated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/skills-radar.svg generated/github-activity-radar.svg
          if git diff --cached --quiet; then
            echo "Radar charts are already up to date."
          else
            git commit -m "chore: update skill map radar charts"
            git push
          fi
